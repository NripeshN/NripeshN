name: Refresh profile cards

# Redraws the SVG cards in assets/ (and their alt text in README.md) with live
# numbers from GitHub, PyPI, Lichess and FIDE. When nothing changed, nothing
# is committed.
#
# GitHub pauses scheduled workflows in public repos after 60 days with no
# activity. If the cards stop moving, run this once from the Actions tab.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Draw the cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_assets.py

      - name: Commit if anything changed
        run: |
          git add assets scripts/data README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile cards"
          git push
